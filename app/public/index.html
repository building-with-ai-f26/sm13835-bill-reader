    const nameTiming = (name) => {
      const words = name.split(/\s+/);
      const each = Math.min(0.3, 0.9 / words.length);
      return { words, each, after: words.length * each + 0.5 }; // half-second pause after the last word
    };
    function nameWords(name, district) {
      const { words, each, after } = nameTiming(name);
      return words.map((w, i) => `<span class="name-word" aria-hidden="true" style="--delay:${(i * each).toFixed(3)}s;--dur:${each.toFixed(3)}s">${esc(w)}</span>`).join(' ')
        + ` <span class="name-district" aria-hidden="true" style="--delay:${after.toFixed(3)}s">${esc(district)}</span>`;
    }

    // The member's state, to the right of their name on the home page, with their district filled in
    // their party color. Drawn from the same U.S. map data as the setup page (same shapes, same
    // projection), so the setup map can turn into this one without a visible swap. Decorative only:
    // screen readers skip it and it can't be clicked.
    function mapBackdrop(usmap, member) {
      const abbr = member.district.split('-')[0];
      const state = usmap && usmap.states.find((st) => st.abbr === abbr);
      const districts = usmap ? usmap.districts.filter((d) => d.state === abbr) : [];
      const current = districts.find((d) => d.id === member.district);
      if (!state || !current) return '';
      const party = { D: 'dem', R: 'rep' }[member.party] || 'ind';
      const [x0, y0, x1, y1] = state.bbox, pad = 0.5;
      return `<svg class="home-map" aria-hidden="true" viewBox="${x0 - pad} ${y0 - pad} ${x1 - x0 + pad * 2} ${y1 - y0 + pad * 2}" focusable="false">
        <path class="state" data-state="${esc(abbr)}" d="${esc(state.path)}" />
        ${districts.filter((d) => d !== current).map((d) => `<path class="district" data-district="${esc(d.id)}" d="${esc(d.path)}" />`).join('')}
        <path class="district current ${party}" data-district="${esc(current.id)}" d="${esc(current.path)}" />
      </svg>`;
    }

    // ---- Choose a bill: H.R. 1, earlier uploads, or drop in a new one.
    const HOME_ICONS = {
      upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /> <polyline points="17 8 12 3 7 8" /> <line x1="12" x2="12" y1="3" y2="15" />', // upload
      list: '<path d="M3 12h.01" /> <path d="M3 18h.01" /> <path d="M3 6h.01" /> <path d="M8 12h13" /> <path d="M8 18h13" /> <path d="M8 6h13" />', // list
      district: TAB_ICONS.district, // map-pin
    };

    // ---- TEMPORARY Media Panel page (#/bills/<member>/<district>/model): each promise, where it
    // came from, how the H.R. 1 brief tested it, the member's votes, and the TV-appearance pipeline.
    const shortDate = (d) => {
      const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || '');
      return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' }) : (d || '');
    };
    const host = (url) => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return ''; } };

    // ---- TV appearances table: one row per appearance, and filters by month or year, network and topic.
    const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const topicKey = (t) => String(t).trim().toLowerCase();
    const topicLabel = (t) => { const s = String(t).trim(); return s.charAt(0).toUpperCase() + s.slice(1); };

    function tvRow(a, done) {
      const t = done.get(a.id);
      const status = t ? `✓ ${esc(t.duration)} · ${t.member_words.toLocaleString()} words`
        : a.youtube ? 'Not transcribed' : 'Not on YouTube';
      const labels = `${a.local ? ' <span class="tag neutral dm-mini">Local</span>' : ''}${a.with ? ` <span class="tag neutral dm-mini" title="With ${esc(a.with)}">Joint</span>` : ''}`;
      return `<tr><td>${esc(shortDate(a.date))}</td><td>${esc(a.network)}${a.show && a.show !== 'unknown' && a.show !== 'news' ? ` · ${esc(a.show)}` : ''}${labels}</td>
        <td>${esc((a.topics || []).join(', '))}</td>
        <td>${a.youtube ? link(a.youtube, 'YouTube ↗') : a.url ? link(a.url, `${host(a.url)} ↗`) : ''}</td><td>${status}</td></tr>`;
    }

    // Each option shows how many appearances it holds, so an empty choice is never offered.
    function tvFilterControls(appearances) {
      const tally = (keyOf) => appearances.reduce((m, a) => { for (const k of [].concat(keyOf(a))) m.set(k, (m.get(k) || 0) + 1); return m; }, new Map());
      const years = tally((a) => a.date.slice(0, 4));
      const months = tally((a) => a.date.slice(0, 7));
      const networks = tally((a) => a.network);
      const topics = tally((a) => (a.topics || []).map(topicKey));
      const firstLabel = new Map();
      appearances.forEach((a) => (a.topics || []).forEach((t) => { if (!firstLabel.has(topicKey(t))) firstLabel.set(topicKey(t), topicLabel(t)); }));
      const dateOptions = [...years.keys()].sort().reverse().map((y) => `<optgroup label="${esc(y)}">
          <option value="${esc(y)}">All of ${esc(y)} (${years.get(y)})</option>
          ${[...months.keys()].filter((m) => m.startsWith(y)).sort().reverse().map((m) => `<option value="${esc(m)}">${MONTHS[Number(m.slice(5)) - 1]} ${esc(y)} (${months.get(m)})</option>`).join('')}
        </optgroup>`).join('');
      const networkOptions = [...networks].sort((a, b) => a[0].localeCompare(b[0], undefined, { sensitivity: 'base' })).map(([n, c]) => `<option value="${esc(n)}">${esc(n)} (${c})</option>`).join('');
      const topicOptions = [...topics].sort((a, b) => firstLabel.get(a[0]).localeCompare(firstLabel.get(b[0]))).map(([k, c]) => `<option value="${esc(k)}">${esc(firstLabel.get(k))} (${c})</option>`).join('');
      return `<div><label for="tv-date">Month or year</label><select id="tv-date"><option value="">All dates</option>${dateOptions}</select></div>
        <div><label for="tv-network">Network</label><select id="tv-network"><option value="">All networks</option>${networkOptions}</select></div>
        <div><label for="tv-topic">Topic</label><select id="tv-topic"><option value="">All topics</option>${topicOptions}</select></div>`;
    }

    function wireTvFilters(dm) {
      const media = dm.media;
      const body = document.getElementById('tv-rows');
      if (!media || !body) return;
      const done = new Map(dm.transcripts.map((t) => [t.id, t]));
      const [date, network, topic] = ['tv-date', 'tv-network', 'tv-topic'].map((id) => document.getElementById(id));
      const count = document.getElementById('tv-count');
      const clear = document.getElementById('tv-clear');
      const total = media.appearances.length;
      const draw = () => {
        const shown = media.appearances.filter((a) => (!date.value || a.date.startsWith(date.value))
          && (!network.value || a.network === network.value)
          && (!topic.value || (a.topics || []).some((t) => topicKey(t) === topic.value)));
        const filtered = Boolean(date.value || network.value || topic.value);
        body.innerHTML = shown.length ? shown.map((a) => tvRow(a, done)).join('')
          : '<tr><td colspan="5" class="meta">No appearances match these filters. Change one, or clear them all.</td></tr>';
        count.textContent = filtered ? `Showing ${shown.length} of ${total} appearances` : `Showing all ${total} appearances`;
        clear.hidden = !filtered;
      };
      [date, network, topic].forEach((s) => s.addEventListener('change', draw));
      clear.addEventListener('click', () => { date.value = ''; network.value = ''; topic.value = ''; draw(); date.focus(); });
    }

    // The review list of TV statements: filters, then one card per statement with Approve / Reject.
    // Decisions are saved by the server (POST /api/candidates/review) and the list redraws in place.
    function wireReview(dm, memberId, readOnly) {
      const panel = document.getElementById('review-panel');
      if (!panel || !dm.candidates) return;
      if (readOnly) panel.insertAdjacentHTML('beforebegin', '<div class="card notice"><strong>Read-only demo:</strong> you can browse every statement, but approving and rejecting work only in the local app.</div>');
      const all = dm.candidates.candidates;
      const view = { status: 'pending', kind: 'all', flagged: false };
      const btn = (group, value, label) => `<button type="button" class="filter-btn" data-${group}="${value}" aria-pressed="${view[group] === value}">${esc(label)}</button>`;
      const card = (c) => `<div class="dm-box dm-cand ${esc(c.status)}">
          <div><span class="tag ${c.kind === 'promise' ? 'neutral' : 'mixed'}">${c.kind === 'promise' ? 'Promise' : 'Record claim'}</span>
            <span class="tag neutral">${esc(c.topic)} · ${esc(c.strength)}</span>
            ${c.status !== 'pending' ? `<span class="tag ${c.status === 'approved' ? 'helps' : 'hurts'}">${c.status === 'approved' ? 'Approved' : 'Rejected'}</span>` : ''}</div>
          <blockquote>“${esc(c.quote)}”</blockquote>
          <div class="meta">${esc(c.summary)}</div>
          <div class="meta">Scope: ${esc(c.scope)}</div>
          <div class="meta">${esc(shortDate(c.date))} · ${esc(c.network)}${c.show && !['news', 'unknown'].includes(c.show) ? ` · ${esc(c.show)}` : ''}
            ${c.youtube ? ` · ${link(c.youtube, `Watch at ${c.timestamp} ↗`)}` : ''}${c.official_check === 'confirmed' ? ' · ✓ Matches the official transcript' : ''}${c.also_in.length ? ` · Also in ${esc(c.also_in.join(', '))}` : ''}</div>
          ${c.flags.map((f) => `<div class="dm-flag">⚠ ${esc(f)}</div>`).join('')}
          <div class="dm-actions">${readOnly ? '' : c.status === 'pending'
            ? `<button type="button" class="filter-btn" data-review="approved" data-id="${esc(c.id)}">Approve</button><button type="button" class="filter-btn" data-review="rejected" data-id="${esc(c.id)}">Reject</button>`
            : `<button type="button" class="filter-btn" data-review="pending" data-id="${esc(c.id)}">Undo</button>`}</div>
        </div>`;
      const draw = () => {
        const count = (s) => all.filter((c) => s === 'all' || c.status === s).length;
        const shown = all
          .filter((c) => view.status === 'all' || c.status === view.status)
          .filter((c) => view.kind === 'all' || c.kind === view.kind)
          .filter((c) => !view.flagged || c.flags.length)
          .sort((a, b) => b.date.localeCompare(a.date));
        panel.innerHTML = `<div class="filter-row">${btn('status', 'pending', `Pending (${count('pending')})`)}${btn('status', 'approved', `Approved (${count('approved')})`)}${btn('status', 'rejected', `Rejected (${count('rejected')})`)}${btn('status', 'all', `All (${all.length})`)}</div>
          <div class="filter-row" style="margin-top:8px">${btn('kind', 'all', 'Promises and claims')}${btn('kind', 'promise', 'Promises')}${btn('kind', 'record_claim', 'Record claims')}
            <button type="button" class="filter-btn" data-flagged="1" aria-pressed="${view.flagged}">Flagged only</button></div>
          <div class="dm-cands">${shown.map(card).join('') || '<p class="meta">Nothing here.</p>'}</div>`;
      };
      panel.addEventListener('click', async (event) => {
        const b = event.target.closest('button');
        if (!b) return;
        if (b.dataset.status) view.status = b.dataset.status;
        else if (b.dataset.kind) view.kind = b.dataset.kind;
        else if (b.dataset.flagged) view.flagged = !view.flagged;
        else if (b.dataset.review) {
          b.disabled = true;
          const response = await fetch('/api/candidates/review', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ member: memberId, id: b.dataset.id, status: b.dataset.review }) });
          const result = await response.json();
          if (!response.ok) { b.disabled = false; alertBox(result.error); return; }
          Object.assign(all.find((c) => c.id === b.dataset.id), result.candidate);
        }
        draw();
      });
      const alertBox = (msg) => panel.insertAdjacentHTML('afterbegin', `<div class="card alert possible">${esc(msg)}</div>`);
      draw();
    }

    function dataModelHtml(dm) {
      const { promises, votes_on_bill: votes } = dm.member;
      const alerts = new Map(dm.alerts.map((a) => [a.promise_id, a]));
      const count = (list, key) => list.reduce((m, x) => m.set(key(x), (m.get(key(x)) || 0) + 1), new Map());
      const sourceTypes = count(promises, (p) => p.source_type);
      const direct = dm.alerts.filter((a) => a.severity === 'direct').length;
      const arrow = '<span class="dm-arrow" aria-hidden="true">→</span>';
      const stage = (label, num, meta, pending) => `<div class="dm-stage${pending ? ' pending' : ''}"><div class="dm-label">${esc(label)}</div><div class="dm-num">${esc(num)}</div><div class="meta">${meta}</div></div>`;
      const voteLine = votes.map((v) => `${esc(v.vote)} · ${esc(shortDate(v.date))}`).join('<br />');

      const chains = promises.map((p) => {
        const a = alerts.get(p.id);
        const test = a
          ? `<span class="tag ${esc(a.severity)}">${a.severity === 'direct' ? 'Direct conflict' : 'Possible tension'}</span>
             <div class="meta">${plural((a.section_ids || []).length, 'H.R. 1 section')} cited</div>
             <details><summary>Why</summary>${esc(a.explanation)}</details>`
          : '<span class="meta">Not checked against H.R. 1 yet.</span>';
        return `<div class="dm-chain">
          <div class="dm-box"><div class="dm-label">Promise</div>
            <span class="tag neutral">${esc(p.topic)} · ${esc(p.strength)}</span>
            <blockquote>“${esc(p.quote)}”</blockquote>
            <div class="meta">Scope: ${esc(p.scope)}${p.other_bill ? ' (another bill)' : ''}</div></div>
          ${arrow}
          <div class="dm-box"><div class="dm-label">Where it was said</div>
            <strong>${esc(p.source_type)}</strong>
            <div class="meta">${esc(shortDate(p.date))}${esc((p.date || '').replace(/^\d{4}-\d{2}-\d{2}/, ''))}</div>
            <div class="meta">${p.url ? link(p.url, `${host(p.url)} ↗`) : 'No link'}</div></div>
          ${arrow}
          <div class="dm-box"><div class="dm-label">H.R. 1 check</div>${test}
            <div class="meta" style="margin-top:6px">His votes: ${votes.map((v) => esc(v.vote)).join(', ')}</div></div>
        </div>`;
      }).join('');

      const media = dm.media;
      const tv = media ? (() => {
        const done = new Map(dm.transcripts.map((t) => [t.id, t]));
        const onYoutube = media.appearances.filter((a) => a.youtube).length;
        const cost = dm.transcripts.reduce((n, t) => n + (t.cost_usd || 0), 0);
        const words = dm.transcripts.reduce((n, t) => n + t.member_words, 0);
        const rows = media.appearances.map((a) => tvRow(a, done)).join('');
        return `<h2>TV appearances (new source, in progress)</h2>
          <p class="meta">${esc(media.scope)}. Gemini watched each YouTube link and wrote a speaker-labeled transcript; nothing was downloaded. Transcripts stay on this computer.</p>
          <div class="dm-flow">
            ${stage('Appearances found', media.appearances.length, `${(media.checked_and_excluded || []).length} more checked and excluded`)}${arrow}
            ${stage('On YouTube', onYoutube, `${media.appearances.length - onYoutube} not posted there`)}${arrow}
            ${stage('Transcribed', dm.transcripts.length, `${words.toLocaleString()} of his words · $${cost.toFixed(2)}`)}${arrow}
            ${(() => {
              const c = dm.candidates ? dm.candidates.candidates : [];
              const approved = c.filter((x) => x.status === 'approved' && x.kind === 'promise').length;
              const pending = c.filter((x) => x.status === 'pending').length;
              return c.length
                ? stage('Promises from TV', approved, `${plural(c.length, 'statement')} found · ${pending} awaiting review`, !approved)
                : stage('Promises from TV', 0, 'Next step: Claude pulls out promises; staff approve each one', true);
            })()}
          </div>
          <div class="dm-entities">${[...count(media.appearances, (a) => a.network)].sort((x, y) => y[1] - x[1]).map(([net, n]) => {
            const ids = media.appearances.filter((a) => a.network === net);
            const t = ids.filter((a) => done.has(a.id));
            return `<div class="dm-box"><div class="dm-label">${esc(net)}${ids.some((a) => a.local) ? ' · local' : ''}</div><strong>${plural(n, 'appearance')}</strong>
              <div class="meta">${t.length} transcribed · ${t.reduce((s, a) => s + done.get(a.id).member_words, 0).toLocaleString()} of his words</div></div>`;
          }).join('')}</div>
          ${media.appearances.filter((a) => a.accuracy_check).map((a) => `<div class="card alert possible" style="margin-top:12px"><span class="tag possible">Accuracy check</span>
            <div><strong>${esc(a.show)}, ${esc(shortDate(a.date))}:</strong> ${esc(a.accuracy_check)}</div></div>`).join('')}
          <h3 class="dm-subhead">Every appearance</h3>
          <div class="dm-filters" id="tv-filters">${tvFilterControls(media.appearances)}</div>
          <div class="dm-filter-status"><p class="meta" id="tv-count" aria-live="polite">Showing all ${media.appearances.length} appearances</p>
            <button type="button" class="filter-btn dm-clear" id="tv-clear" hidden>Clear filters</button></div>
          <div class="scroll"><table><thead><tr><th>Date</th><th>Network · show</th><th>Topics</th><th>Video</th><th>Transcript (his words)</th></tr></thead><tbody id="tv-rows">${rows}</tbody></table></div>
          ${dm.candidates ? `<h2 id="review">TV statements to review</h2>
            <p class="meta">Claude Sonnet read every transcript and pulled out promises and claims about his record ($${esc(dm.candidates.cost_usd.toFixed(2))}).
              Each quote was checked word for word against his own lines; ${plural(dm.candidates.dropped.length, 'statement')} failed and ${dm.candidates.dropped.length === 1 ? 'was' : 'were'} dropped.
              Approve a statement to add it to his promises (or record claims); nothing counts until a person approves it. Watch the clip before approving anything flagged.</p>
            <div id="review-panel"></div>` : ''}`;
      })() : '';

      const fields = (keys, added = []) => `<div class="dm-fields">${keys.map((k) => `<code>${esc(k)}</code>`).join('')}${added.map((k) => `<code class="new">+ ${esc(k)}</code>`).join('')}</div>`;
      const entity = (name, rel, keys, added) => `<div class="dm-box dm-entity"><h3>${esc(name)}</h3><div class="meta">${esc(rel)}</div>${fields(keys, added)}</div>`;

      return `<p class="meta">Temporary view. Each promise is shown with where it was said, then how the H.R. 1 analysis tested it and how ${esc(dm.member.name)} voted.</p>
        <div class="dm-flow">
          ${stage('Sources', sourceTypes.size, [...sourceTypes].map(([t, n]) => `${esc(t)} (${n})`).join('<br />'))}${arrow}
          ${stage('Promises', promises.length, esc([...count(promises, (p) => p.topic).keys()].join(', ')))}${arrow}
          ${stage('Tested against H.R. 1', dm.alerts.length, `${direct} direct conflict · ${dm.alerts.length - direct} possible tension`)}${arrow}
          ${stage('His H.R. 1 votes', votes.length, voteLine)}
        </div>
        <h2>Each promise, end to end</h2>
        ${chains}
        ${tv}
        <h2>The data model</h2>
        <p class="meta">What each record holds and how they connect. Green fields are planned for promises that come from TV.</p>
        <div class="dm-entities">
          ${entity('Member', 'data/members/<id>.json · has many promises and votes', ['id', 'name', 'party', 'district', 'promises[]', 'votes_on_bill[]'])}
          ${entity('Promise', 'inside the member file · tested by brief alerts', promises[0] ? Object.keys(promises[0]) : [], ['appearance_id', 'timestamp', 'youtube'])}
          ${entity('Vote', 'inside the member file · from House roll calls', votes[0] ? Object.keys(votes[0]) : [])}
          ${entity('Brief alert', 'data/briefs/hr1-<id>.json · one per promise', dm.alerts[0] ? Object.keys(dm.alerts[0]) : ['promise_id', 'severity', 'explanation', 'section_ids'])}
          ${media ? entity('TV appearance', `data/media/<id>.json · ${media.appearances.length} for this member`, ['id', 'date', 'network', 'show', 'type', 'with', 'local', 'topics', 'url', 'youtube', 'accuracy_check']) : ''}
          ${media ? entity('Transcript', 'data/media/transcripts/ (Git-ignored) · one per appearance', ['duration', 'turns[t, speaker, text]', 'on_screen', 'source']) : ''}
        </div>`;
    }

          <div class="tiles home-tiles">

            ${tile(`${home}/list`, HOME_ICONS.list, 'Review Uploaded Bills', `${plural(bills.length, 'bill')} · ${ready} ready`, `H.R. 1 and your uploads, and whether each brief is ready for ${member.name.replace(/\.$/, '')}.`)}

        if (!response.ok) { app.innerHTML = `<div class="auth"><div class="card alert possible">${esc(dm.error)}</div></div>`; return; }

        wireTvFilters(dm);
        wireReview(dm, memberId, readOnly);
        return;

      if (readOnly) {
        app.innerHTML = `<div class="bills">${head('Upload New Bill')}
          <div class="card notice"><strong>Uploads are off in this public demo.</strong> Bills can be unreleased drafts, so uploads are saved
            only on the computer running the local app, and analyzing one costs money. To see a finished brief, open
            <a href="${home}/list">H.R. 1</a>.</div></div>`;
        return;
      }
      app.innerHTML = `<div class="bills">${head('Upload New Bill')}
        <div class="card dropzone" id="drop">
          <strong>Drag and drop a bill here</strong>
          <span class="meta">PDF or Word (.docx), up to 15 MB. Saved only on this computer.</span>
          <button type="button" class="secondary" id="choose">Choose a file</button>
          <input type="file" id="file" accept=".pdf,.docx" hidden />
        </div>
        <div id="preview" class="ph-no-capture" aria-live="polite"></div>
      </div>`;

      const drop = document.getElementById('drop');
      const input = document.getElementById('file');
      const preview = document.getElementById('preview');
      document.getElementById('choose').addEventListener('click', () => input.click());
      input.addEventListener('change', () => input.files[0] && readBill(input.files[0]));
      drop.addEventListener('dragover', (event) => { event.preventDefault(); drop.classList.add('over'); });
      drop.addEventListener('dragleave', () => drop.classList.remove('over'));
      drop.addEventListener('drop', (event) => {
        event.preventDefault();
        drop.classList.remove('over');
        if (event.dataTransfer.files[0]) readBill(event.dataTransfer.files[0]);
      });

      async function readBill(file) {
        const type = fileType(file);
        const fail = (message) => { preview.innerHTML = `<div class="card alert possible">${esc(message)}</div>`; };
        if (!type) return fail('Only PDF and Word (.docx) files are supported. For an older .doc file, save it as .docx first.');
        if (file.size > 15 * 1024 * 1024) return fail('This file is larger than 15 MB.');
        preview.innerHTML = '<div class="card">Reading the file…</div>';
        let pages, result;
        try {
          const buffer = await file.arrayBuffer();
          pages = type === 'pdf' ? await pdfPages(buffer) : await docxPages(buffer);
          result = BillText.fromPages(pages);
        } catch (error) {
          return fail(`Could not read this file: ${error.message}`);
        }
        const s = result.sections;
        preview.innerHTML = `<form class="card form" id="save">
          <h3>${esc(file.name)}</h3>
          <p>${result.method === 'headings'
            ? `Found <strong>${s.length} section${s.length === 1 ? '' : 's'}</strong> by their headings${type === 'pdf' ? ` across ${pages.length} page${pages.length === 1 ? '' : 's'}` : ''}.`
            : `<strong>No section headings found</strong> (like "SEC. 2."), so the text was cut into ${s.length} numbered part${s.length === 1 ? '' : 's'}. Findings will cite parts instead of sections.`}
            ${result.skipped_chars ? ' The title page and enacting clause before the first section are not included.' : ''}</p>
          <ul class="section-preview">${s.slice(0, 8).map((x) => `<li>Sec. ${esc(x.id)}. ${esc(x.header)}</li>`).join('')}${s.length > 8 ? `<li class="meta">…and ${s.length - 8} more</li>` : ''}</ul>
          <label for="title">Name this bill</label>
          <input id="title" maxlength="120" required autocomplete="off" />
          <p class="meta">The file is saved on this computer only, and is not sent anywhere. Analyzing it will be a separate step.</p>
          <button type="submit" class="primary" id="save-btn">Save bill</button>
          <p id="save-error" class="meta" role="alert"></p>
        </form>`;
        document.getElementById('title').focus();
        document.getElementById('save').addEventListener('submit', async (event) => {
          event.preventDefault();
          const title = document.getElementById('title').value.trim();
          const error = document.getElementById('save-error');
          if (!title) { error.textContent = 'Give the bill a name.'; return; }
          const button = document.getElementById('save-btn');
          button.disabled = true;
          button.textContent = 'Saving…';
          try {
            const response = await fetch('/api/bills', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ title, file_type: type, file_name: file.name, file_base64: await readAsBase64(file), pages }),
            });
            const body = await response.json();
            if (!response.ok) throw new Error(body.error);
            go(`${base}/${encodeURIComponent(body.bill.id)}`);
          } catch (e) {
            error.textContent = `Could not save: ${e.message}`;
            button.disabled = false;
            button.textContent = 'Save bill';
          }
        });
      }
    }

    // ---- The paid Analyze step. Shows the estimate and a hard cap, says where the text goes,
    // and needs an explicit "I agree" before the button works. The server re-checks the cap.
    // Glass lens on the brief tabs. While a mouse is over the tab bar, the lens eases toward the tab
    // under the pointer (taking its width), stretching slightly with its speed like a drop of liquid,
    // and a highlight follows the pointer inside it. Off the bar, or on touch screens, it rests on the
    // current tab. Keyboard focus moves it too. Reduced motion: it jumps, with no stretch.
    function wireTabGlass(bar) {
      const glass = bar && bar.querySelector('.tab-glass');
      const tabs = bar ? [...bar.querySelectorAll('a.tab')] : [];
      if (!glass || !tabs.length) return;
      bar.classList.add('glass-on');
      const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const home = () => bar.querySelector('.tab[aria-current="page"]') || tabs[0];
      const pos = { x: 0, w: 0 }, target = { x: 0, w: 0 };
      let frame = 0, last = null;
      const aim = (tab) => { target.x = tab.offsetLeft; target.w = tab.offsetWidth; if (!frame) frame = requestAnimationFrame(step); };
      const paint = (stretch) => {
        glass.style.width = `${pos.w}px`;
        glass.style.transform = `translateX(${pos.x}px) scale(${stretch}, ${1 - (stretch - 1) * 0.6})`;
      };
      function step(now) {
        const dt = last === null ? 16 : Math.min(48, now - last);
        last = now;
        const k = still ? 1 : 1 - Math.pow(0.0009, dt / 1000 * 1.6); // eases out; frame-rate independent
        const dx = (target.x - pos.x) * k;
        pos.x += dx;
        pos.w += (target.w - pos.w) * k;
        const done = Math.abs(target.x - pos.x) < 0.3 && Math.abs(target.w - pos.w) < 0.3;
        if (done) { pos.x = target.x; pos.w = target.w; }
        paint(still || done ? 1 : 1 + Math.min(0.12, Math.abs(dx) / Math.max(1, pos.w) * 0.9));
        if (done) { frame = 0; last = null; } else frame = requestAnimationFrame(step);
      }
      // Start on the current tab with no movement.
      const start = home();
      pos.x = target.x = start.offsetLeft; pos.w = target.w = start.offsetWidth; paint(1);
      // Tab widths change once the web font arrives; settle on the current tab again then.
      if (document.fonts) document.fonts.ready.then(() => { if (bar.isConnected && !bar.matches(':hover')) aim(home()); });
      // The tab nearest the pointer: gaps and padding count toward their closest tab.
      const nearest = (clientX) => tabs.reduce((best, t) => {
        const r = t.getBoundingClientRect();
        const d = clientX < r.left ? r.left - clientX : clientX > r.right ? clientX - r.right : 0;
        return d < best.d ? { t, d } : best;
      }, { t: tabs[0], d: Infinity }).t;
      bar.addEventListener('pointermove', (event) => {
        if (event.pointerType !== 'mouse') return;
        aim(nearest(event.clientX));
        const r = glass.getBoundingClientRect();
        glass.style.setProperty('--mx', `${event.clientX - r.left}px`);
        glass.style.setProperty('--my', `${event.clientY - r.top}px`);
        glass.style.setProperty('--glow', '1');
      });
      bar.addEventListener('pointerleave', () => { glass.style.setProperty('--glow', '0'); aim(home()); });
      bar.addEventListener('focusin', (event) => { if (event.target.matches('a.tab')) aim(event.target); });
      bar.addEventListener('focusout', (event) => { if (!bar.contains(event.relatedTarget)) aim(home()); });
      // Tabs move when the window is resized; this listener removes itself once the page changes.
      const onResize = () => (bar.isConnected ? aim(home()) : window.removeEventListener('resize', onResize));
      window.addEventListener('resize', onResize);
    }

    async function wireAnalyze({ member, district, bill }) {
      const panel = document.getElementById('analyze-panel');
      const query = `member=${encodeURIComponent(member.id)}&bill=${encodeURIComponent(bill.id)}`;
      const money = (n) => `$${Number(n).toFixed(2)}`;
      const status = await (await fetch(`/api/analyze/status?${query}`)).json();
      if (status.job && status.job.status === 'running') return watch();
      const estResponse = await fetch(`/api/estimate?${query}`);
      const est = await estResponse.json();
      if (!estResponse.ok) { panel.innerHTML = `<p class="error">${esc(est.error || 'Could not get a cost estimate.')}</p>`; return; }
      const blocked = est.read_only ? 'This public demo is read-only, so it cannot run new AI analyses. Saved briefs are shown; analyzing works in the local app.'
        : !est.has_key ? 'There is no OpenRouter key in .env. Add one and restart the server.'
        : est.busy ? 'Another analysis is running. Wait for it to finish, then reload this page.'
        : est.key_remaining !== null && est.key_remaining < est.cap
          ? `Your OpenRouter key's spending limit has ${money(Math.max(0, est.key_remaining))} left, and this run is allowed to spend up to ${money(est.cap)}. The limit resets on the schedule set for the key in OpenRouter (for example monthly); the key owner can also change it there.`
        : est.available !== null && est.available < est.cap
          ? `Not enough credits: your balance is ${money(est.available)}, and this run is allowed to spend up to ${money(est.cap)}. Add credits on OpenRouter or analyze a shorter bill.`
          : '';
      panel.innerHTML = `<h3>Analyze this bill for ${esc(member.name)}</h3>
        <p>Estimated cost: <strong>about ${money(est.estimate)}</strong>. The run stops itself at <strong>${money(est.cap)}</strong>, so it cannot cost more than that.
          ${est.available !== null ? `Your OpenRouter balance is ${money(est.available)}.` : ''}${est.key_remaining !== null ? ` This key may spend ${money(Math.max(0, est.key_remaining))} more before its limit.` : ''}</p>
        <p class="meta">A short bill takes about a minute; a bill as long as H.R. 1 takes about five.</p>
        <div class="notice"><strong>Before you analyze:</strong> the bill text, this district's facts and the member's public commitments are sent to OpenRouter and Anthropic, where AI models read them. Do not analyze a confidential draft unless your office allows it.</div>
        ${status.job && status.job.status === 'error' ? `<p class="error">The last attempt stopped: ${esc(status.job.error)}</p>` : ''}
        ${blocked ? `<p class="error">${esc(blocked)}</p>` : `
        <label class="check"><input type="checkbox" id="consent" /> I understand where the text goes, and I agree to spend up to ${money(est.cap)}.</label>
        <button type="button" class="primary" id="analyze" disabled>Analyze, up to ${money(est.cap)}</button>`}
        <p id="analyze-msg" class="error" role="alert"></p>`;
      if (blocked) return;
      const consent = document.getElementById('consent');
      const button = document.getElementById('analyze');
      consent.addEventListener('change', () => { button.disabled = !consent.checked; });
      button.addEventListener('click', async () => {
        button.disabled = true;
        const response = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ member: member.id, district: district.id, bill: bill.id, accepted_cap: est.cap }),
        });
        const result = await response.json();
        if (!response.ok) {
          document.getElementById('analyze-msg').textContent = result.error;
          button.disabled = !consent.checked;
          return;
        }
        watch();
      });

      async function watch() {
        while (document.body.contains(panel)) {
          const { job } = await (await fetch(`/api/analyze/status?${query}`)).json();
          if (!job) return wireAnalyze({ member, district, bill });
          panel.innerHTML = `<h3>Analyzing for ${esc(member.name)}…</h3>
            <p class="meta">Capped at ${money(job.cap)}. You can leave this page; the run continues while the server is running.</p>
            <ol class="progress">${job.progress.map((p) => `<li>${esc(p)}</li>`).join('')}</ol>`;
          if (job.status === 'done') return route();
          if (job.status === 'error') return wireAnalyze({ member, district, bill });
          await new Promise((resolve) => setTimeout(resolve, 2000));
        }
      }
    }

    // ---- The ⋮ menu on each analyzed bill in "Review Uploaded Bills": Download, Share, Delete.
    const MENU_ICONS = {
      more: '<circle cx="12" cy="5" r="1" /> <circle cx="12" cy="12" r="1" /> <circle cx="12" cy="19" r="1" />', // ellipsis-vertical
      download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /> <polyline points="7 10 12 15 17 10" /> <line x1="12" x2="12" y1="15" y2="3" />',
      share: '<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" /> <polyline points="16 6 12 2 8 6" /> <line x1="12" x2="12" y1="2" y2="15" />',
      delete: '<path d="M3 6h18" /> <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /> <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />', // trash-2
      email: '<rect width="20" height="16" x="2" y="4" rx="2" /> <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />', // mail
      text: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />', // message-square
    };
    const menuIcon = (name) => `<svg viewBox="0 0 24 24" aria-hidden="true">${MENU_ICONS[name]}</svg>`;

    // One bill card. An analyzed bill gets a ⋮ button in its top-right corner (a button cannot sit
    // inside the card's link, so both sit side by side in a row box).
    function billRowHtml(b, member, base, readOnly) {
      const card = `<a class="card bill-card" href="${base}/${esc(b.id)}">
        <strong>${esc(b.title)}</strong>
        <span class="meta">${esc(b.status)}${b.section_count ? ` · ${b.section_count} section${b.section_count === 1 ? '' : 's'}` : ''}${b.created_at ? ` · uploaded ${esc(b.created_at.slice(0, 10))}` : ''}</span>
        <span class="meta">${b.has_brief ? `Brief ready for ${esc(member.name)}` : `Not analyzed for ${esc(member.name)} yet`}</span></a>`;
      const menu = b.has_brief ? `
        <button type="button" class="kebab" aria-haspopup="menu" aria-expanded="false" aria-label="Actions for ${esc(b.title)}">${menuIcon('more')}</button>
        <div class="kebab-menu" role="menu" aria-label="Actions for ${esc(b.title)}" hidden>
          <button type="button" role="menuitem" data-action="download">${menuIcon('download')}Download</button>
          <button type="button" role="menuitem" data-action="share">${menuIcon('share')}Share</button>
          ${readOnly ? '' : `<button type="button" role="menuitem" class="danger" data-action="delete">${menuIcon('delete')}Delete</button>`}
        </div>` : '';
      return `<div class="bill-row${b.has_brief ? ' has-menu' : ''}${b.kind === 'upload' ? ' ph-no-capture' : ''}" data-bill="${esc(b.id)}">${card}${menu}</div>`;
    }

    // Opening, closing and keyboard use of the ⋮ menus (one open at a time), and what each item does.
    function wireBillMenus(list, member, bills) {
      let openRow = null;
      const close = (focusButton) => {
        if (!openRow) return;
        const button = openRow.querySelector('.kebab');
        openRow.querySelector('.kebab-menu').hidden = true;
        button.setAttribute('aria-expanded', 'false');
        openRow.classList.remove('menu-open');
        if (focusButton) button.focus();
        openRow = null;
      };
      const open = (row) => {
        close(false);
        openRow = row;
        row.classList.add('menu-open');
        row.querySelector('.kebab').setAttribute('aria-expanded', 'true');
        const menu = row.querySelector('.kebab-menu');
        menu.hidden = false;
        menu.querySelector('[role="menuitem"]').focus();
      };
      list.addEventListener('click', (event) => {
        const kebab = event.target.closest('.kebab');
        if (kebab) {
          const row = kebab.closest('.bill-row');
          if (openRow === row) close(true); else open(row);
          return;
        }
        const item = event.target.closest('[role="menuitem"]');
        if (!item) return;
        const row = item.closest('.bill-row');
        const bill = bills.find((b) => b.id === row.dataset.bill);
        close(true);
        if (item.dataset.action === 'download') downloadAnalysis(member, bill);
        if (item.dataset.action === 'share') openShareDialog(member, bill);
        if (item.dataset.action === 'delete') openDeleteDialog(member, bill, row.querySelector('.kebab'));
      });
      list.addEventListener('keydown', (event) => {
        if (!openRow) return;
        const items = [...openRow.querySelectorAll('[role="menuitem"]')];
        const at = items.indexOf(document.activeElement);
        if (event.key === 'Escape') { event.preventDefault(); close(true); }
        else if (event.key === 'ArrowDown') { event.preventDefault(); items[(at + 1) % items.length].focus(); }
        else if (event.key === 'ArrowUp') { event.preventDefault(); items[(at - 1 + items.length) % items.length].focus(); }
        else if (event.key === 'Home') { event.preventDefault(); items[0].focus(); }
        else if (event.key === 'End') { event.preventDefault(); items[items.length - 1].focus(); }
        else if (event.key === 'Tab') close(false);
      });
      // A click anywhere else closes it. This listener removes itself once the page changes.
      const outside = (event) => {
        if (!list.isConnected) { document.removeEventListener('pointerdown', outside); return; }
        if (openRow && !openRow.contains(event.target)) close(false);
      };
      document.addEventListener('pointerdown', outside);
    }

    async function loadBrief(member, bill) {
      const response = await fetch(`/api/brief?member=${encodeURIComponent(member.id)}&district=${encodeURIComponent(member.district)}&bill=${encodeURIComponent(bill.id)}`);
      const data = await response.json();
      if (!response.ok || !data.brief) throw new Error(data.error || 'This analysis could not be found. Reload the page.');
      return data;
    }

    // A pop-up built fresh each time and removed when it closes. Escape and a click on the dimmed
    // backdrop close it; focus goes back to whatever opened it.
    function showDialog(html, returnFocus) {
      const dialog = document.createElement('dialog');
      dialog.className = 'confirm';
      dialog.setAttribute('aria-labelledby', 'dialog-title');
      dialog.innerHTML = html;
      document.body.append(dialog);
      dialog.addEventListener('click', (event) => { if (event.target === dialog) dialog.close(); });
      dialog.addEventListener('close', () => { dialog.remove(); if (returnFocus && returnFocus.isConnected) returnFocus.focus(); });
      dialog.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => dialog.close()));
      dialog.showModal();
      return dialog;
    }
    const dateLabel = (iso) => (iso ? new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '');

    // ---- Download: a print-ready copy of the whole analysis. The browser's print window opens
    // with "Save as PDF"; the suggested file name is the bill, member and district.
    async function downloadAnalysis(member, bill) {
      let data;
      try { data = await loadBrief(member, bill); } catch (error) { showDialog(`<h2 id="dialog-title">Could not download</h2><p>${esc(error.message)}</p><div class="confirm-actions"><button type="button" class="secondary" data-close autofocus>Close</button></div>`); return; }
      const { brief, district } = data;
      const c = brief.coverage;
      const ref = (id, page) => `Sec. ${esc(id)}${page ? ` (p. ${esc(page)})` : ''}`;
      const facts = (keys) => keys.map((k) => district.facts.find((f) => f.key === k)).filter(Boolean).map((f) => `${esc(f.label)}: ${esc(f.display)}`).join(' · ');
      const findings = findingsFor(brief);
      const group = (effect, title) => {
        const items = findings.filter((i) => i.effect === effect);
        return items.length ? `<h3>${title} (${items.length})</h3>${items.map((i) => `<div class="p-item">
          <strong>${esc(i.headline)}</strong><p>${esc(i.plain_english)}</p><p>${esc(i.who_in_district)}</p>
          <p class="p-quote">“${esc(i.bill_quote)}” <span class="p-meta">${ref(i.section_id, i.page)}, ${esc(i.section_header)}</span></p>
          ${i.district_facts.length ? `<p class="p-meta">District evidence: ${facts(i.district_facts)}</p>` : ''}</div>`).join('')}` : '';
      };
      const alerts = brief.promise_alerts || [];
      const promiseHtml = !c.promises_reviewed
        ? '<p>No public commitments have been collected for this member yet, so the bill was not checked against any. This does not mean no conflict exists.</p>'
        : alerts.length ? alerts.map((a) => {
          const p = (member.promises || []).find((x) => x.id === a.promise_id) || {};
          return `<div class="p-item"><strong>${a.severity === 'direct' ? 'Direct conflict' : 'Possible tension'}${p.topic ? `: ${esc(p.topic)}` : ''}</strong>
            <p>${esc(a.explanation)}</p>${p.quote ? `<p class="p-quote">“${esc(p.quote)}” <span class="p-meta">${esc(p.source_type)}, ${esc(p.date)} · ${esc(p.url)}</span></p>` : ''}
            <p class="p-meta">Cites ${a.section_ids.map((id) => `Sec. ${esc(id)}`).join(', ')}</p></div>`;
        }).join('') : `<p>None found among the ${c.promises_checked} commitments reviewed. This does not mean no conflict exists.</p>`;
      const notCovered = c.not_covered_headers || [];
      const root = document.createElement('div');
      root.id = 'print-root';
      if (bill.kind === 'upload') root.className = 'ph-no-capture';
      root.innerHTML = `<p class="p-kicker">Bill Reader · Bill analysis</p>
        <h1>${esc(bill.title)}</h1>
        <p class="p-meta">Prepared for ${esc(memberLabel(member))}, ${esc(district.id)} · ${esc(bill.status)} · Analyzed ${esc(dateLabel(brief.generated_at))}</p>
        ${notCovered.length ? `<p class="p-note"><strong>This brief is not complete.</strong> ${notCovered.length} sections flagged as relevant to this district were not analyzed in depth, so findings may leave out important effects.</p>` : ''}
        <h2>Bill Summary</h2>
        <ul>${brief.overview.what_it_does.map((b) => `<li>${esc(b.text)} <span class="p-meta">${b.sources.map((s) => ref(s.section_id, s.page)).join(', ')}</span></li>`).join('')}</ul>
        <h2>Constituent Impact: ${esc(district.id)}</h2>
        <p>${esc(brief.overview.district_bottom_line)}</p>
        <h2>District Impact</h2>
        ${group('hurts', 'Harmful to the district') + group('helps', 'Helpful to the district') + group('mixed', 'Mixed effects') || '<p>No district findings.</p>'}
        <h2>Promise Alerts if the member votes yes</h2>
        ${promiseHtml}
        <h2>What was reviewed</h2>
        <p>${c.sections_screened} of ${c.sections_total} sections screened; ${c.flagged} flagged; ${c.analyzed} analyzed in depth. ${c.dropped_by_verification.length} findings removed because their citations failed verification.</p>
        <p class="p-meta">AI-generated with ${esc(brief.models.screen)} and ${esc(brief.models.deep)}. Check the cited bill sections before relying on a finding.</p>`;
      document.getElementById('print-root')?.remove();
      document.body.append(root);
      document.body.classList.add('printing');
      const title = document.title;
      document.title = `Bill analysis - ${bill.title} - ${member.name} ${district.id}`.replace(/[\\/:*?"<>|]/g, '');
      const done = () => { document.body.classList.remove('printing'); root.remove(); document.title = title; window.removeEventListener('afterprint', done); };
      window.addEventListener('afterprint', done);
      window.print();
    }

    // ---- Share: a preview of the choices only. Sending is not connected yet.
    function openShareDialog(member, bill) {
      const option = (icon, label) => `<button type="button" class="share-option" aria-disabled="true" data-label="${esc(label)}">
        <span class="share-icon">${icon}</span><span class="share-label">${esc(label)}</span><span class="tag neutral">Coming soon</span></button>`;
      const dialog = showDialog(`<h2 id="dialog-title">Share this analysis</h2>
        <p>Send a PDF of ${esc(member.name)}'s analysis of <strong>${esc(bill.title)}</strong>.</p>
        <div class="share-options">
          ${option(menuIcon('email'), 'Email')}
          ${option(menuIcon('text'), 'Text message')}
          ${option('<span class="x-mark" aria-hidden="true">X</span>', 'Post on X')}
        </div>
        <p class="meta" id="share-msg" aria-live="polite">Sharing is not connected yet. For now, use Download and attach the PDF yourself.</p>
        <div class="confirm-actions"><button type="button" class="secondary" data-close autofocus>Close</button></div>`, document.activeElement);
      dialog.querySelectorAll('.share-option').forEach((b) => b.addEventListener('click', () => {
        dialog.querySelector('#share-msg').textContent = `${b.dataset.label} sharing is coming soon. For now, use Download and attach the PDF yourself.`;
      }));
    }

    // ---- Delete this member's analysis of one bill, after an "Are you sure?" pop-up. The server
    // moves the brief to data/deleted/ (recoverable by hand); the bill stays, as "Not analyzed yet".
    async function openDeleteDialog(member, bill, returnFocus) {
      let brief = {};
      try { ({ brief } = await loadBrief(member, bill)); } catch { /* the pop-up still works without the date and cost */ }
      const made = dateLabel(brief.generated_at);
      const cost = typeof brief.cost_usd === 'number' ? `$${brief.cost_usd.toFixed(2)}` : null;
      const dialog = showDialog(`<h2 id="dialog-title">Delete this analysis?</h2>
        <p>This removes ${esc(member.name)}'s analysis of <strong>${esc(bill.title)}</strong>${made ? `, made ${esc(made)}` : ''}.
          The bill itself stays, and other members' analyses are not affected.</p>
        <p class="meta">To see it again you would run Analyze again${cost ? `, which cost ${esc(cost)} last time` : ', which costs money'}.
          A copy is kept on this computer in data/deleted/.</p>
        <p id="delete-msg" class="error" role="alert"></p>
        <div class="confirm-actions">
          <button type="button" class="secondary" data-close autofocus>Cancel</button>
          <button type="button" class="primary danger-fill" id="delete-confirm">Delete analysis</button>
        </div>`, returnFocus);
      const confirmBtn = dialog.querySelector('#delete-confirm');
      confirmBtn.addEventListener('click', async () => {
        confirmBtn.disabled = true;
        const response = await fetch('/api/brief/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ member: member.id, bill: bill.id }),
        }).catch(() => null);
        const result = response ? await response.json().catch(() => ({})) : {};
        if (!response || !response.ok) {
          dialog.querySelector('#delete-msg').textContent = result.error || 'Could not delete. Check that the local server is running, then try again.';
          confirmBtn.disabled = false;
          return;
        }
        dialog.close();
        route(); // redraw the list: this bill now says "Not analyzed yet"
      });
    }

    function route() {
      const [, view, a, b, c, d] = location.hash.split('/').map((part) => decodeURIComponent(part || ''));
      app.classList.remove('ph-no-capture');
      const shown = view === 'setup' ? setupView()
        : view === 'bills' ? billsView(a, b, c)
        : view === 'brief' ? briefView(a, b, c, d)
        : loginView();
      Promise.resolve(shown).catch((error) => { app.textContent = 'Could not load: ' + error.message; });
      window.scrollTo(0, 0);
    }
    window.addEventListener('hashchange', route);
    route();
  </script>
</body>
</html>

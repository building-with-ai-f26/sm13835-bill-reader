<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bill Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <style>
    :root {
      --bg: #ffffff; --dot: #e2e5ea; --card: #ffffff; --text: #111827; --muted: #5b6472; --border: #e5e7eb;
      --accent: #1f3a5f; --accent-soft: #eef2f8; --bad: #b42318; --bad-bg: #fef3f2; --warn: #8a5a00; --warn-bg: #fffaeb;
      --good: #067647; --good-bg: #ecfdf3;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 1px 3px rgba(16, 24, 40, 0.06);
      --shadow-hover: 0 4px 8px -2px rgba(16, 24, 40, 0.08), 0 2px 4px -2px rgba(16, 24, 40, 0.05);
    }
    * { box-sizing: border-box; }
    /* White page with a faint grid of small gray dots. */
    body { margin: 0; overflow-x: clip; /* words flying in from off-screen never add a sideways scrollbar */ color: var(--text); line-height: 1.55; -webkit-font-smoothing: antialiased;
      background-color: var(--bg); background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 22px 22px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; }
    main { max-width: 1200px; margin: 0 auto; padding: 32px 32px 80px; }
    @media (max-width: 860px) { main { padding: 20px 16px 64px; } }
    .kicker { font-size: 13px; color: var(--muted); }
    .kicker a { color: var(--muted); }
    h1 { font-size: 30px; line-height: 1.2; margin: 4px 0 6px; letter-spacing: -0.02em; font-weight: 700; }
    h2 { font-size: 19px; margin: 32px 0 12px; color: var(--text); font-weight: 600; letter-spacing: -0.01em; }
    h3 { font-size: 16px; margin: 0 0 6px; font-weight: 600; }
    p { margin: 0 0 8px; }
    a { color: var(--accent); }
    li { margin-bottom: 8px; }
    .meta { font-size: 13px; color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 12px; box-shadow: var(--shadow); }
    .alert.direct { background: var(--bad-bg); border-color: #fecdca; }
    .alert.possible { background: var(--warn-bg); border-color: #fedf89; }
    .tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-bottom: 8px; text-transform: capitalize; }
    .tag.direct, .tag.hurts { background: var(--bad-bg); color: var(--bad); box-shadow: inset 0 0 0 1px #fecdca; }
    .tag.possible, .tag.mixed { background: var(--warn-bg); color: var(--warn); box-shadow: inset 0 0 0 1px #fedf89; }
    .tag.helps { background: var(--good-bg); color: var(--good); box-shadow: inset 0 0 0 1px #abefc6; }
    blockquote { margin: 10px 0; padding-left: 12px; border-left: 3px solid var(--border); font-size: 14px; color: #374151; }
    .columns, .card-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 24px; align-items: start; }
    @media (max-width: 860px) { .columns, .card-grid { grid-template-columns: minmax(0, 1fr); gap: 12px; } }
    /* District profile: one card per topic; inside, each fact is a row with the label on the left and
       the number on the right (its count, when there is one, in smaller text below). */
    .fact-groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
    @media (max-width: 760px) { .fact-groups { grid-template-columns: minmax(0, 1fr); } }
    /* Each topic is a closed box with an arrow; clicking (or Enter/Space) drops its facts down. */
    .fact-group { margin: 0; padding: 0; }
    .fact-group summary { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 14px 20px; cursor: pointer; list-style: none; border-radius: inherit; }
    .fact-group summary::-webkit-details-marker { display: none; }
    .fact-group summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .fact-group summary:hover .fact-chevron { color: var(--accent); }
    .fact-group h3 { display: flex; align-items: center; gap: 10px; flex: 1; margin: 0; font-size: 16px; font-weight: 700; }
    .fact-chevron { flex: none; width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
      color: var(--muted); transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), color 0.15s ease; }
    .fact-group[open] .fact-chevron { transform: rotate(180deg); }
    .fact-group .fact-rows { padding: 0 20px 8px; border-top: 1px solid var(--border); }
    @media (prefers-reduced-motion: reduce) { .fact-chevron { transition: none; } }
    .fact-group h3 svg { flex: none; width: 32px; height: 32px; padding: 7px; border-radius: 8px; background: var(--accent-soft); color: var(--accent);
      fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; box-sizing: border-box; }
    .fact-rows { margin: 0; }
    .fact-row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 10px 0; border-top: 1px solid var(--border); }
    .fact-row:first-child { border-top: 0; }
    .fact-row dt { font-size: 14px; color: var(--text); }
    .fact-row dd { margin: 0; text-align: right; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .fact-row dd small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
    .chips { margin-top: 8px; font-size: 13px; color: var(--muted); }
    .scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); background: var(--card); }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; background: #f9fafb; }
    th, td { border-bottom: 1px solid var(--border); padding: 9px 12px; text-align: left; white-space: nowrap; }
    tbody tr:last-child td { border-bottom: 0; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tr.new-lines td { border-top: 2px solid var(--accent); }
    .map-card { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; }
    .map-card svg { height: 220px; width: auto; flex: none; display: block; }
    .map-text { flex: 1 1 160px; }
    .map-text strong { display: block; font-size: 24px; line-height: 1.2; }
    .state { fill: #f3f4f6; stroke: #a8adb7; stroke-width: 2; }
    .district { fill: transparent; stroke: #d0d5dd; stroke-width: 1.5; }
    .district.current { stroke: #475467; stroke-width: 2.5; }
    .district.dem { fill: #c5daf3; }
    .district.rep { fill: #f4c7c2; }
    .district.ind { fill: #dedede; }
    .map-label { font-size: 44px; font-weight: 700; fill: var(--text); text-anchor: middle; dominant-baseline: middle; }
    .sources a { font-size: 12px; white-space: nowrap; margin-right: 6px; }

    /* Brief header, the five option cards and the section tabs. */
    .page-head { margin-bottom: 24px; }
    .back { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 500; text-decoration: none; margin-bottom: 8px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .tile { display: flex; flex-direction: column; gap: 4px; padding: 20px; min-height: 172px; border: 1px solid var(--border); border-radius: 14px;
      background: var(--card); color: var(--text); text-decoration: none; box-shadow: var(--shadow);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease; }
    a.tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); border-color: #c7d2e3; }
    a.tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .tile.locked { color: var(--muted); background: #fbfbfc; box-shadow: none; }
    .tile-icon { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); margin-bottom: 10px; }
    .tile.locked .tile-icon { background: #f2f4f7; color: #98a2b3; }
    .tile-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .tile-title { font-size: 16px; font-weight: 600; }
    .tile-stat { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
    .tile.locked .tile-stat { font-size: 15px; font-weight: 500; }
    .tile-desc { font-size: 13px; color: var(--muted); }
    .tile-go { margin-top: auto; padding-top: 8px; /* pinned to the bottom, so "Open" lines up across boxes */ font-size: 13px; font-weight: 600; color: var(--accent); }
    /* Brief tabs: centered on the page, roomy, with larger text. */
    .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 5px; margin: 0 auto 12px; background: #f2f4f7; border-radius: 14px; width: fit-content; max-width: 100%; }
    .tab { display: inline-flex; align-items: center; gap: 8px; padding: 11px 22px; border-radius: 10px; font-size: 16px; font-weight: 500;
      color: var(--muted); text-decoration: none; white-space: nowrap; }
    .tab svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    a.tab:hover { color: var(--text); }
    .tab[aria-current="page"] { background: var(--card); color: var(--text); box-shadow: var(--shadow); }
    .tab.locked { color: #98a2b3; }
    .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    /* Glass lens on the brief tabs: a frosted, glossy pill that glides under the pointer while it is
       over the tab bar (only there), stretches a little as it moves, and carries a soft highlight at
       the pointer. Off the bar it flows back and rests on the current tab as its selected look.
       Without JavaScript, the current tab keeps its plain white highlight. */
    .tabs.glass-on { position: relative; isolation: isolate; }
    .tabs.glass-on .tab { position: relative; z-index: 1; }
    .tabs.glass-on .tab[aria-current="page"] { background: transparent; box-shadow: none; }
    .tab-glass { position: absolute; z-index: 0; box-sizing: border-box; top: 5px; left: 0; height: calc(100% - 10px); width: 0; border-radius: 10px;
      pointer-events: none; transform-origin: center; will-change: transform, width;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.92) 0%, rgba(255, 255, 255, 0.55) 55%, rgba(255, 255, 255, 0.72) 100%);
      -webkit-backdrop-filter: blur(10px) saturate(180%); backdrop-filter: blur(10px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 1), inset 0 -1px 2px rgba(31, 58, 95, 0.10), inset 0 0 0 0.5px rgba(31, 58, 95, 0.10),
        0 6px 16px rgba(16, 24, 40, 0.12), 0 1px 3px rgba(16, 24, 40, 0.10); }
    /* The light inside the glass: a bright spot at the pointer and a cool rim along the bottom edge. */
    .tab-glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; opacity: var(--glow, 0); transition: opacity 0.2s ease;
      background: radial-gradient(90px 60px at var(--mx, 50%) var(--my, 50%), rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0) 70%); }
    .tab-glass::after { content: ""; position: absolute; inset: 0; border-radius: inherit;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0) 60%, rgba(120, 160, 220, 0.18) 100%); }

    .filter { margin-top: 8px; }
    .filter-label { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter-btn { display: inline-flex; align-items: center; gap: 6px;
      font: inherit; font-size: 13px; font-weight: 500; min-height: 32px; padding: 4px 12px; border-radius: 999px; cursor: pointer;
      background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .filter-btn:hover { border-color: var(--accent); }
    .filter-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .filter-btn.no-findings { color: var(--muted); border-style: dashed; }
    .filter-icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round; }
    .filter-btn[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
    .filter-note { margin-top: 12px; }
    .filter-note ul { margin: 8px 0 0; padding-left: 20px; }
    .filter-note li { margin-bottom: 4px; }

    .auth { max-width: 520px; margin: 48px auto; }
    .form { display: grid; gap: 6px; padding: 24px; }
    .form label { font-weight: 600; font-size: 14px; margin-top: 8px; }
    .form input, .form select { font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid #d0d5dd;
      border-radius: 8px; background: var(--card); color: var(--text); width: 100%; }
    .form input:focus-visible, .form select:focus-visible, .primary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .form select:disabled { color: var(--muted); background: #f9fafb; }
    .primary { font: inherit; font-weight: 600; margin-top: 16px; padding: 12px 16px; min-height: 44px; border: 0; border-radius: 8px;
      background: var(--accent); color: #fff; cursor: pointer; }
    .primary:hover:not(:disabled) { background: #183049; }
    .primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .bills { max-width: 860px; margin: 32px auto; }
    .map-layer { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: -1; }
    /* Home page state map, to the right of the member's name: in the margin beside the content column
       when the screen has room for it; otherwise smaller, at the right end of the name row, behind it. */
    .bills.home { position: relative; }
    .home-map { position: absolute; z-index: -1; top: 24px; right: 0; height: 150px; width: auto; pointer-events: none; }
    @media (min-width: 1220px) { .home-map { right: auto; left: calc(100% + 28px); top: 40px; height: 250px; } }
    @media (max-width: 600px) { .home-map { top: 28px; height: 110px; } }
    /* Same geometry and line style as the setup map, so the map can fly from one page to the other. */
    .home-map path { vector-effect: non-scaling-stroke; stroke-linejoin: round; }
    .home-map .state { stroke-width: 0.8px; }
    .home-map .district { stroke-width: 0.6px; }
    .home-map .district.current { stroke-width: 1px; }
    /* Cards on this page let the map show through faintly. */
    .home-tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 28px; }
    @media (max-width: 760px) { .home-tiles { grid-template-columns: minmax(0, 1fr); } }
    /* Home boxes: icon, title and headline centered; the description stays left-aligned. */
    .home-tiles .tile-icon { align-self: center; }
    .home-tiles .tile-title, .home-tiles .tile-stat { text-align: center; }
    .bills .tile, .bills .card { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
    /* Setup: the form on the left, a U.S. map on the right (stacked on phones). */
    .setup { max-width: 1120px; margin: 48px auto; display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 40px; align-items: start; }
    @media (max-width: 860px) { .setup { grid-template-columns: minmax(0, 1fr); gap: 16px; margin: 24px auto; } }
    .us-map-card { margin: 0; padding: 16px; }
    /* Setup: a state picker, then one square box per member (district, round portrait, name), tinted
       by party. Light party tints: the name text stays dark, so contrast is the same as on white. */
    .setup-state { max-width: 440px; padding: 0; margin-top: 20px; }
    /* State picker: the name in the welcome page's heavy all-caps Inter, in navy; the open list is a
       column of large rectangles. */
    .state-label { font-weight: 600; font-size: 14px; margin-top: 8px; }
    .state-picker { position: relative; }
    .setup-state + #member-status { margin-top: 12px; }
    .state-button { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 68px; padding: 10px 14px 10px 20px;
      font: inherit; text-align: left; color: var(--accent); background: #fff; border: 1px solid #d0d5dd; border-radius: 12px; cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease; }
    .state-button:hover { border-color: #98a2b3; }
    .state-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .state-picker .state-name { flex: 1; min-width: 0; font-weight: 800; text-transform: uppercase; letter-spacing: -0.01em; line-height: 1.05; }
    .state-button .state-name { font-size: 30px; }
    .state-button.empty .state-name { color: var(--muted); }
    .state-picker .state-count { flex: none; font-size: 14px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
    .state-chevron { flex: none; width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.15s ease; }
    .state-button[aria-expanded="true"] .state-chevron { transform: rotate(180deg); }
    .state-list { position: absolute; z-index: 30; top: calc(100% + 6px); left: 0; right: 0; display: grid; gap: 6px; margin: 0; padding: 6px;
      max-height: min(440px, 60vh); overflow-y: auto; overscroll-behavior: contain; list-style: none;
      background: #fff; border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 12px 32px rgba(16, 24, 40, 0.16); }
    .state-list[hidden] { display: none; }
    .state-list [role="option"] { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 18px; color: var(--accent);
      border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
    .state-list .state-name { font-size: 22px; }
    .state-list [role="option"].active { background: var(--accent-soft); border-color: #9fb4d3; }
    .state-list [role="option"][aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    @media (max-width: 480px) { .state-button .state-name { font-size: 24px; } .state-list .state-name { font-size: 19px; } }
    @media (prefers-reduced-motion: reduce) { .state-chevron, .state-button { transition: none; } }
    .member-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 8px; }
    @media (max-width: 480px) { .member-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .member-grid .member-box img, .member-grid .member-box-photo { width: 84px; height: 84px; } .member-grid .member-box-name { font-size: 14px; } }
    .member-box { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; aspect-ratio: 1;
      padding: 10px; border: 1px solid var(--border); border-radius: 14px; color: var(--text); text-decoration: none; text-align: center;
      transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.15s ease, box-shadow 0.15s ease; }
    .member-box.dem { background: #eef3fd; border-color: #d3e0f7; }
    .member-box.rep { background: #fdf0ee; border-color: #f2d4cf; }
    .member-box.ind { background: #f3f4f6; }
    @media (hover: hover) and (pointer: fine) {
      a.member-box:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
      a.member-box.dem:hover { border-color: #9fb9ea; }
      a.member-box.rep:hover { border-color: #e3a79e; }
    }
    a.member-box:active { transform: scale(0.985); transition-duration: 0.09s; }
    .member-box:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .member-box-district { font-size: 13px; line-height: 1.2; font-weight: 700; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
    .member-box img, .member-box-photo { width: 60px; height: 60px; flex: none; border-radius: 50%; object-fit: cover; background: #e4e7ec; box-shadow: 0 0 0 2px #fff; }
    .member-box-name { font-size: 13px; font-weight: 600; line-height: 1.2; }
    .member-box-note { font-weight: 500; color: var(--muted); }
    .member-grid .member-box-name.long { font-size: 12px; } /* e.g. Debbie Wasserman Schultz: stays on two lines */
    .member-key { grid-column: 1 / -1; margin: 4px 0 0; }
    @media (prefers-reduced-motion: reduce) { .member-box { transition: none; } }
    .us-map { display: block; width: 100%; height: auto; aspect-ratio: 5 / 3; }
    .us-map-card figcaption { margin-top: 8px; }
    .us-state { fill: #ffffff; stroke: #c4cad3; stroke-width: 0.8; vector-effect: non-scaling-stroke; stroke-linejoin: round; transition: fill 0.3s ease; }
    .us-state.selected { fill: #e4e7ec; stroke: #98a2b3; }
    .us-district { fill: none; stroke: #b4bbc6; stroke-width: 0.6; vector-effect: non-scaling-stroke; stroke-linejoin: round; opacity: 0; transition: opacity 0.4s ease; }
    .us-district.visible { opacity: 1; }
    .us-district.selected { stroke: #000000; stroke-width: 2.2; }

    /* TEMPORARY Media Panel page (route .../model): how each promise is sourced and tested. Delete this block,
       the "model" page in billsView and /api/datamodel in server.js to remove it. */
    .home-tiles .dm-tile { grid-column: 1 / -1; min-height: 0; flex-direction: row; align-items: center; gap: 14px; border-style: dashed; }
    .home-tiles .dm-tile .tile-icon { margin-bottom: 0; }
    /* Media Panel box: a darkened TV control room photo fills the whole box. The overlay is clear at the
       top, so the screens stay the focus, and dark along the bottom behind the white text (above 4.5:1). */
    .home-tiles .media-tile { position: relative; min-height: 220px; padding: 24px; align-items: flex-end;
      border: 1px solid #0b1220; color: #fff;
      background: linear-gradient(0deg, rgba(6, 11, 22, 0.94) 0%, rgba(6, 11, 22, 0.7) 38%, rgba(6, 11, 22, 0.05) 85%), var(--photo) center 30% / cover; }
    a.media-tile:hover { border-color: #0b1220; }
    .home-tiles .media-tile .tile-title { font-size: 20px; color: #fff; }
    .home-tiles .dm-tile.media-tile .tile-stat { color: rgba(255, 255, 255, 0.8); }
    .media-tile .tile-desc { color: rgba(255, 255, 255, 0.88); font-size: 14px; }
    .media-tile .tile-go { color: #fff; }

    .dm-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 6px; }
    .dm-chain { display: grid; grid-template-columns: minmax(0, 1.4fr) 22px minmax(0, 1fr) 22px minmax(0, 1.1fr); align-items: stretch; margin-bottom: 14px; }
    .dm-chain .dm-arrow { justify-self: center; }
    .dm-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }

    .dm-subhead { font-size: 15px; margin: 24px 0 8px; }

    .dm-filters label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }

      .dm-chain { grid-template-columns: minmax(0, 1fr); }

    /* The signed-in member's name, in their party's color. */
    .member-name { font-size: clamp(40px, 8vw, 76px); line-height: 1.02; font-weight: 800; text-transform: uppercase; letter-spacing: -0.01em; margin: 8px 0 6px; overflow-wrap: anywhere;
      overflow-x: clip; /* phones size the page to include the words' off-screen starting point; clipping here prevents that */ }
    .member-name.rep { color: #9b1c1c; }

    .member-name.ind { color: #111827; }

    /* "Welcome, Congressman/Congresswoman": half the name's size; fades in once the district's 1.2s fade ends. */
    .member-welcome { font-family: "Times New Roman", Times, serif; font-style: italic; font-weight: 400; color: #000;
      font-size: clamp(20px, 4vw, 38px); line-height: 1.2; margin: 0 0 6px; animation: fade-in 1.2s ease-out var(--delay) both; }
    /* Home tiles rise into place one after another, left to right, while the name flies in.
       "backwards" (not "both") hands the tile back once it lands, so the hover lift still works. */
    .home-tiles .tile { animation: rise-in 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) backwards; }
    .home-tiles .tile:nth-child(2) { animation-delay: 0.15s; }
    .home-tiles .tile:nth-child(3) { animation-delay: 0.3s; }
    .home-tiles .tile:nth-child(4) { animation-delay: 0.45s; }
    @keyframes rise-in { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }

    .kebab { position: absolute; top: 10px; right: 10px; width: 44px; height: 44px; display: grid; place-items: center;

      .p-quote { font-style: italic; }
      .p-note { padding: 6px 10px; border: 1px solid #c99a2e; border-radius: 6px; }

    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const link = (url, label) => `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>`;

    const citedItems = (alert, items) => alert.section_ids.map((id) => items.find((i) => i.section_id === id)).filter(Boolean);

    // An alert belongs to every issue of the bill sections it cites.
    const alertIssues = (alert, items) => [...new Set(citedItems(alert, items).flatMap((i) => i.issues || []))];

    function alertCard(alert, promise, items) {
      const cited = citedItems(alert, items);
      const issues = alertIssues(alert, items);
      return `<div class="card alert ${esc(alert.severity)}">
        <span class="tag ${esc(alert.severity)}">${alert.severity === 'direct' ? 'Direct conflict' : 'Possible tension'}</span>
        <h3>${esc(promise.topic)}</h3>
        <p>${esc(alert.explanation)}</p>
        <blockquote>“${esc(promise.quote)}”
          <div class="meta">${esc(promise.strength)} · ${esc(promise.source_type)}, ${esc(promise.date)} · ${link(promise.url, 'source')}<br />Scope: ${esc(promise.scope)}</div>
        </blockquote>
        ${cited.map((i) => `<blockquote>“${esc(i.bill_quote)}”<div class="meta">Bill text, Sec. ${esc(i.section_id)}, ${esc(i.section_header)}</div></blockquote>`).join('')}
        ${issues.length ? `<div class="chips">Issues: ${issues.map(esc).join(' · ')}</div>` : ''}
      </div>`;
    }

    function itemCard(item, facts) {
      const cited = item.district_facts.map((key) => facts.find((f) => f.key === key))
        .filter(Boolean).map((f) => `${esc(f.label)}: <strong>${esc(f.display)}</strong>`).join(' · ');
      return `<div class="card">
        <span class="tag ${esc(item.effect)}">${esc(item.effect)}</span>
        <h3>${esc(item.headline)}</h3>
        <p>${esc(item.plain_english)}</p>
        <p>${esc(item.who_in_district)}</p>
        <blockquote>“${esc(item.bill_quote)}”<div class="meta">Sec. ${esc(item.section_id)}, ${esc(item.section_header)}</div></blockquote>
        <div class="chips">District evidence: ${cited}</div>
        ${(item.issues || []).length ? `<div class="chips">Issues: ${item.issues.map(esc).join(' · ')}</div>` : ''}
      </div>`;
    }

    const shownEffects = new Set(['helps', 'hurts', 'mixed']);

    // The analyzed findings a reader can see, narrowed to one issue if one is chosen.
    function findingsFor(brief, issue) {
      return brief.items.filter((i) => shownEffects.has(i.effect) && (!issue || (i.issues || []).includes(issue)));

      "Families & Children": '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /> <circle cx="9" cy="7" r="4" /> <path d="M22 21v-2a4 4 0 0 0-3-3.87" /> <path d="M16 3.13a4 4 0 0 1 0 7.75" />', // users
      "Seniors & Social Security": '<path d="M11 14h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 16" /> <path d="m7 20 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9" /> <path d="m2 15 6 6" /> <path d="M19.5 8.5c.7-.7 1.5-1.6 1.5-2.7A2.73 2.73 0 0 0 16 4a2.78 2.78 0 0 0-5 1.8c0 1.2.8 2 1.5 2.8L16 12Z" />', // hand-heart

      "Foreign Policy": '<circle cx="12" cy="12" r="10" /> <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" /> <path d="M2 12h20" />', // globe
      "Civil Rights": '<path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" /> <path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" /> <path d="M7 21h10" /> <path d="M12 3v18" /> <path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2" />', // scale
      "Other": '<circle cx="12" cy="12" r="1" /> <circle cx="19" cy="12" r="1" /> <circle cx="5" cy="12" r="1" />', // ellipsis
    };
    const issueIcon = (name) => `<svg class="filter-icon" viewBox="0 0 24 24" aria-hidden="true">${ISSUE_ICONS[name] || ISSUE_ICONS.Other}</svg>`;

    // Issues with findings come first, most findings first. Other always goes last.
    function filterHtml(brief, active) {
      const issues = (brief.issues || []).map((issue) => ({ ...issue, count: findingsFor(brief, issue.name).length }))
        .sort((a, b) => (a.name === 'Other') - (b.name === 'Other') || b.count - a.count || b.sections.length - a.sections.length);
      if (!issues.length) return '';
      const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
      const button = (value, content, cls, tip) =>
        `<button type="button" class="filter-btn ${cls}" data-issue="${esc(value)}" aria-pressed="${value === active}"${tip ? ` title="${esc(tip)}"` : ''}>${content}</button>`;
      return `<div class="filter"><div class="filter-label">Filter by issue</div>
        <div class="filter-row">${button('', 'All issues', '', '')}${issues.map((i) =>
          button(i.name, `${issueIcon(i.name)}<span>${esc(i.name)}</span>`, i.count ? '' : 'no-findings',
            `${plural(i.sections.length, 'bill section')} · ${plural(i.count, 'district finding')}`)).join('')}</div>
        <p class="meta filter-note">Hover over an issue to see how many bill sections touch it and how many were analyzed for your district. A dashed button means the bill touches that issue but this brief has no district finding on it yet.</p></div>`;
    }

    // Written so an empty result can never be read as "this issue has no effect."
    function issueNote(brief, issue, findings) {
      if (!issue) {
        const total = findingsFor(brief).length;
        return `<p class="meta filter-note">Showing the highest-priority findings out of ${total}. Choose an issue to see every finding on it.</p>`;
      }
      const shown = new Set(findings.map((i) => i.section_id));
      const entry = brief.issues.find((i) => i.name === issue);
      const others = entry.sections.filter((s) => !shown.has(s.section_id));
      const count = `${others.length} section${others.length === 1 ? '' : 's'}`;
      const list = `<ul>${others.map((s) => `<li>${sectionRef(s.section_id, s.page)}: ${esc(s.header)}</li>`).join('')}</ul>`;
      if (!findings.length) {
        return `<div class="card alert possible filter-note"><strong>No district finding on ${esc(issue)} yet.</strong>
          The bill has ${count} on this issue, but this brief did not analyze them for your district. That does not mean they have no effect here.${list}</div>`;
      }
      if (!others.length) return '';
      return `<div class="card filter-note"><strong>Not reflected below:</strong> ${count} on ${esc(issue)} with no district finding in this brief. That does not mean they have no effect here.
        <details><summary>See these sections</summary>${list}</details></div>`;
    }

    function findingsHtml({ brief, district }, issue) {
      const findings = findingsFor(brief, issue);
      if (issue && !findings.length) return issueNote(brief, issue, findings);
      const byEffect = (effect, limit) => {
        const matching = findings.filter((i) => i.effect === effect);
        return issue ? matching : matching.slice(0, limit); // A chosen issue shows every finding on it.
      };
      const cards = (items) => items.map((i) => itemCard(i, district.facts)).join('');
      const none = '<div class="card">None identified.</div>';
      const mixed = byEffect('mixed', 4);
      return `${issueNote(brief, issue, findings)}
        <div class="columns">
          <div><h2>Most harmful to your district</h2>${cards(byEffect('hurts', 6)) || none}</div>
          <div><h2>Most helpful to your district</h2>${cards(byEffect('helps', 6)) || none}</div>
        </div>
        ${mixed.length ? `<h2>Mixed effects</h2><div class="card-grid">${cards(mixed)}</div>` : ''}`;
    }

    // Written so an empty result can never be read as "no conflict on this issue."
    function alertsHtml({ brief, member }, issue) {
      const promises = member.promises || [];
      const c = brief.coverage;
      const all = brief.promise_alerts || [];
      if (!c.promises_reviewed) {
        return `<h2>Promise alerts if you vote yes</h2>
          <div class="card">No public commitments have been collected for this member yet, so the bill could not be checked against any. This does not mean no conflict exists.</div>`;
      }
      const alerts = issue ? all.filter((a) => alertIssues(a, brief.items).includes(issue)) : all;
      const empty = issue && all.length
        ? `No promise alert cites a section on ${esc(issue)}. This does not mean no conflict exists: alerts can only cite sections analyzed in depth, and only ${c.promises_checked} commitments were reviewed.`
        : `None found among the ${c.promises_checked} commitments reviewed. This does not mean no conflict exists.`;
      return `<h2>Promise alerts if you vote yes</h2>
        ${issue && alerts.length ? `<p class="meta">Showing ${alerts.length} of ${all.length} alerts: those citing a section on ${esc(issue)}.</p>` : ''}
        <div class="card-grid">${alerts.map((a) => alertCard(a, promises.find((p) => p.id === a.promise_id), brief.items)).join('') ||
          `<div class="card">${empty}</div>`}</div>
        <p class="meta">${c.promises_checked} of ${c.promises_reviewed} commitments checked against the whole bill. A commitment that is not in this set cannot trigger an alert.</p>`;
    }

    // Filtering redraws only the findings or alerts on this page; the rest stays where it is.
    function wireFilter(data) {
      const row = document.querySelector('.filter-row');
      if (!row) return;
      row.addEventListener('click', (event) => {
        const chosen = event.target.closest('.filter-btn');
        if (!chosen) return;
        row.querySelectorAll('.filter-btn').forEach((b) => b.setAttribute('aria-pressed', String(b === chosen)));
        const findings = document.getElementById('findings');
        const alerts = document.getElementById('alerts');
        if (findings) findings.innerHTML = findingsHtml(data, chosen.dataset.issue);
        if (alerts) alerts.innerHTML = alertsHtml(data, chosen.dataset.issue);
      });
    }

    // ---- The brief is split into five sections. The bill's landing page shows one card per
    // section with a headline number; each card opens that section on its own page, with tabs.
    const TAB_ICONS = {
      overview: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /> <path d="M14 2v4a2 2 0 0 0 2 2h4" /> <path d="M10 9H8" /> <path d="M16 13H8" /> <path d="M16 17H8" />', // file-text
      impact: '<path d="M3 3v16a2 2 0 0 0 2 2h16" /> <path d="M18 17V9" /> <path d="M13 17V5" /> <path d="M8 17v-3" />', // chart-column
      promises: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /> <path d="M12 9v4" /> <path d="M12 17h.01" />', // triangle-alert
      district: '<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" /> <circle cx="12" cy="10" r="3" />', // map-pin
      votes: ISSUE_ICONS['Campaign Finance'], // vote
    };
    const tabIcon = (id) => `<svg viewBox="0 0 24 24" aria-hidden="true">${TAB_ICONS[id]}</svg>`;

    const TABS = [
      { id: 'overview', title: 'Bill Overview', needsBrief: true, desc: () => 'What the bill does, in plain English, with links to the exact page of the bill.' },
      { id: 'impact', title: 'District Impact', needsBrief: true, desc: () => 'The provisions that most help or hurt this district, with evidence. Filter by issue.' },
      { id: 'promises', title: 'Promise Alerts', needsBrief: true, desc: () => "Where a yes vote may conflict with the member's public commitments." },
      { id: 'district', title: 'District Profile', desc: () => 'Census facts, a district map and House election results since 2006.' },
      { id: 'votes', title: 'Votes & Bill Text', desc: (bill) => (bill.kind === 'official'
        ? "The member's recorded votes on this bill, with links to the official text."
        : 'Not yet voted on. Read the uploaded bill section by section.') },
    ];

    const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
    const yesNo = (vote) => (/^(yea|aye|yes)$/i.test(vote) ? 'Yes' : /^(nay|no)$/i.test(vote) ? 'No' : vote);

    // The headline number on each card.
    function tabStat(id, { brief, member, district, bill }) {
      if (id === 'district') return `${plural(district.facts.length, 'fact')} · ${plural(district.elections.length, 'election')}`;
      if (id === 'votes') {
        if (bill.kind !== 'official') return 'Not yet voted on';
        const votes = (member.votes_on_bill || []).map((v) => yesNo(v.vote));
        if (!votes.length) return 'No recorded vote';
        return new Set(votes).size === 1 ? `Voted ${votes[0]} · ${plural(votes.length, 'roll call')}` : votes.join(', then ');
      }
      if (!brief) return 'Not analyzed yet';
      if (id === 'overview') return plural(brief.overview.what_it_does.length, 'key point');
      if (id === 'impact') {
        const findings = findingsFor(brief);
        const n = (effect) => findings.filter((i) => i.effect === effect).length;
        return `${n('hurts')} hurt · ${n('helps')} help${n('mixed') ? ` · ${n('mixed')} mixed` : ''}`;
      }
      if (!brief.coverage.promises_reviewed) return 'No commitments collected';
      const alerts = brief.promise_alerts || [];
      if (!alerts.length) return `None among ${plural(brief.coverage.promises_checked, 'commitment')}`;
      const direct = alerts.filter((a) => a.severity === 'direct').length;
      return [direct && `${direct} direct`, alerts.length - direct && `${alerts.length - direct} possible`].filter(Boolean).join(' · ');
    }

    // Shown wherever findings appear, so a partial brief is never mistaken for a complete one.
    function incompleteHtml(brief) {
      const notCovered = (brief && brief.coverage.not_covered_headers) || [];
      if (!notCovered.length) return '';
      return `<div class="card alert possible"><strong>This brief is not complete.</strong>
        ${notCovered.length} sections flagged as relevant to this district were not analyzed in depth, so findings may leave out important effects.
        <details><summary>See the sections not covered</summary><ul>${notCovered.map((h) => `<li>${esc(h)}</li>`).join('')}</ul></details></div>`;
    }

    function hubHtml(data, base) {
      const { brief, member, district, bill } = data;
      const tiles = TABS.map((t) => {
        const locked = t.needsBrief && !brief;
        const inner = `<span class="tile-icon">${tabIcon(t.id)}</span>
          <span class="tile-title">${esc(t.title)}</span>
          <span class="tile-stat">${esc(tabStat(t.id, data))}</span>
          <span class="tile-desc">${esc(t.desc(bill))}</span>
          ${locked ? '' : '<span class="tile-go">Open →</span>'}`;
        return locked ? `<div class="tile locked" aria-disabled="true">${inner}</div>` : `<a class="tile" href="${base}/${t.id}">${inner}</a>`;
      }).join('');
      if (brief) return `${incompleteHtml(brief)}<div class="tiles">${tiles}</div>`;
      const what = bill.kind === 'upload'
        ? `This bill is saved, with ${plural(bill.section_count, 'section')} found. Analyze it to unlock the overview, district impact and promise alerts for ${esc(member.name)} and ${esc(district.id)}.`
        : `Analyze it to unlock the overview, district impact and promise alerts for ${esc(member.name)} and ${esc(district.id)}. The district profile and votes are ready now.`;
      return `<div class="card alert possible"><h3>This bill has not been analyzed yet</h3><p>${what}</p></div>
        <div class="card" id="analyze-panel" aria-live="polite"><p class="meta">Checking what an analysis would cost…</p></div>
        <h2>Brief sections</h2><div class="tiles">${tiles}</div>`;
    }

    function overviewHtml({ brief, district, bill }) {
      const c = brief.coverage;
      const incomplete = c.screen_failures.length + c.deep_failures.length + c.not_analyzed_due_to_cap;
      return `${incompleteHtml(brief)}
        <h2>Bill Summary</h2>
        <div class="card"><ul>${brief.overview.what_it_does.map((b) => `<li>${esc(b.text)}
          <span class="sources">${b.sources.map((s) => sectionRef(s.section_id, s.page)).join(' ')}</span></li>`).join('')}</ul>
          <p class="meta">${bill.kind === 'official' ? 'Links open the official bill text on GovInfo at the page where each section begins.'
            : bill.pdf_url ? 'Links open your uploaded PDF at the page where each section begins.' : 'Links open each section\'s text under Votes & Bill Text.'}</p></div>
        <h2>Constituent Impact: ${esc(district.id)}</h2>
        <div class="card"><p>${esc(brief.overview.district_bottom_line)}</p></div>
        <h2>What was reviewed</h2>
        <div class="card"><p>${c.sections_screened} of ${c.sections_total} sections screened; ${c.flagged} flagged; ${c.analyzed} analyzed in depth.
          ${c.dropped_by_verification.length} findings removed because their citations failed verification.</p>
          ${incomplete ? `<p><strong>Incomplete:</strong> ${c.screen_failures.length} sections failed screening, ${c.deep_failures.length} failed analysis, and ${c.not_analyzed_due_to_cap} flagged sections exceeded the analysis cap.</p>` : ''}
          <p class="meta">Models: ${esc(brief.models.screen)}, ${esc(brief.models.deep)} · Run cost: $${esc(brief.cost_usd)} · Generated ${esc(brief.generated_at)}</p></div>`;
    }

    // District facts grouped by topic. Any fact not listed here still shows, under "Other".
    const FACT_GROUPS = [
      ['Economy & education', '<path d="M3 3v18h18" /><path d="m7 15 4-4 3 3 6-6" />',
        ['median_household_income', 'poverty_pct', 'unemployment_pct', 'bachelors_pct']],
      ['Immigration', '<circle cx="12" cy="12" r="9" /><path d="M3 12h18" /><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18" />',
        ['foreign_born_pct', 'noncitizen_pct', 'other_language_pct', 'limited_english_pct']],
      ['Entitlements & health coverage', '<path d="M12 21s-7-4.4-9.3-9A5 5 0 0 1 12 6a5 5 0 0 1 9.3 6c-2.3 4.6-9.3 9-9.3 9z" />',
        ['social_security_households_pct', 'medicare_coverage_pct', 'medicaid_coverage_pct', 'snap_households_pct', 'uninsured_pct']],
      ['Housing & taxes', '<path d="M3 11 12 4l9 7" /><path d="M5 10v10h14V10" /><path d="M10 20v-6h4v6" />',
        ['median_home_value', 'median_gross_rent', 'median_property_tax', 'owner_occupied_pct']],
      ['Jobs & commuting', '<rect x="3" y="7" width="18" height="13" rx="2" /><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2" /><path d="M3 13h18" />',
        ['occ_management_pct', 'occ_sales_office_pct', 'occ_service_pct', 'occ_production_pct', 'occ_construction_pct', 'work_from_home_pct', 'commute_transit_pct', 'commute_rail_pct']],
      ['People', '<circle cx="9" cy="8" r="3.5" /><path d="M2.5 20a6.5 6.5 0 0 1 13 0" /><path d="M16 4.5a3.5 3.5 0 0 1 0 7" /><path d="M18 14a6.5 6.5 0 0 1 3.5 6" />',
        ['population', 'median_age', 'avg_household_size', 'race_white_pct', 'race_hispanic_pct', 'race_asian_pct', 'race_black_pct']],
      ['Seniors & veterans', '<circle cx="12" cy="9" r="5" /><path d="m9 13.5-2 7.5 5-3 5 3-2-7.5" />',
        ['seniors_voting_age_pct', 'veterans_pct']],
      ['2024 election', '<path d="m9 12 2 2 4-4" /><rect x="3" y="4" width="18" height="16" rx="2" />',
        ['margin_2024', 'turnout_2024']],
    ];
    function factGroupsHtml(facts) {
      const byKey = new Map(facts.map((f) => [f.key, f]));
      const listed = new Set(FACT_GROUPS.flatMap(([, , keys]) => keys));

    // ---- Setup: state, member, then district on the left; a U.S. map on the right that zooms to

    const parseBox = (v) => (typeof v === 'string' ? v.split(/\s+/).map(Number) : v);
    function zoomMap(svg, target) {
      const from = parseBox(svg.getAttribute('viewBox'));

      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { svg.setAttribute('viewBox', to.join(' ')); return; }

      const step = (now) => {
        const t = Math.min(1, (now - start) / ms);
        const e = t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2; // ease in and out
        svg.setAttribute('viewBox', from.map((v, i) => (v + (to[i] - v) * e).toFixed(3)).join(' '));
        if (t < 1) svg._zoom = requestAnimationFrame(step);
      };
      svg._zoom = requestAnimationFrame(step);
    }
    // The chosen district's black outline draws itself in 3 seconds, travelling counterclockwise on screen.
    // How: the line is one long dash with an equally long gap; sliding the dash offset to 0 reveals it
    // along the path. Census rings can run either way, so we measure which way this one turns (signed
    // area from points along it) and slide from the matching side. The dash is measured in screen pixels,
    // because the outline keeps the same thickness at any zoom (non-scaling stroke).
    function drawOutline(path) {
      path.getAnimations().forEach((a) => a.cancel());
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const length = path.getTotalLength();
      let area = 0, prev = path.getPointAtLength(0);
      for (let i = 1; i <= 200; i++) {
        const p = path.getPointAtLength((length * i) / 200);
        area += prev.x * p.y - p.x * prev.y;
        prev = p;
      }
      const clockwise = area > 0; // screen y points down, so a positive area turns clockwise
      const px = length * path.getScreenCTM().a + 2; // a little extra so no gap shows at the end
      path.animate([
        { strokeDasharray: `${px} ${px}`, strokeDashoffset: clockwise ? -px : px },
        { strokeDasharray: `${px} ${px}`, strokeDashoffset: 0 },
      ], { duration: 3000, easing: 'ease-out' }); // moving from the first frame, easing into the close
    }
    // The U.S. map (states and district lines) is fetched once and shared by setup and the home page.
    let usMapRequest = null;
    const getUsMap = () => (usMapRequest ||= fetch('/api/usmap').then((r) => (r.ok ? r.json() : null)).catch(() => null));

    // ---- Map hand-off from setup to the member's home: one map, never disappearing.
    // On Continue we freeze a copy of the setup map where it sits (takeOffMap). The home page's faint
    // backdrop is drawn from the same U.S. map data, so when it has rendered, landMap() flies that copy
    // onto it: the copy moves and grows until the state covers the backdrop's state exactly, while each
    // line and fill changes to the backdrop's own style (read from the backdrop itself) and the other
    // states fade away. The last frame matches the real backdrop, which then takes over unseen.
    let mapFlight = null;
    function takeOffMap(svg, stateAbbr) {
      const state = svg && svg.querySelector(`.us-state[data-state="${CSS.escape(stateAbbr)}"]`);
      if (!state || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const box = svg.getBoundingClientRect();
      const layer = document.createElement('div');
      layer.className = 'map-layer map-flight';
      layer.setAttribute('aria-hidden', 'true');
      const copy = svg.cloneNode(true);
      copy.removeAttribute('id');
      copy.style.cssText = `position:absolute;left:${box.left}px;top:${box.top}px;width:${box.width}px;height:${box.height}px;transform-origin:0 0;`;
      // Keep the district outline exactly as drawn so far, if Continue comes before it finishes.
      const live = svg.querySelector('.us-district.selected'), twin = copy.querySelector('.us-district.selected');
      if (live && twin) { const cs = getComputedStyle(live); twin.style.strokeDasharray = cs.strokeDasharray; twin.style.strokeDashoffset = cs.strokeDashoffset; }
      layer.appendChild(copy);
      document.body.appendChild(layer);
      const flight = { layer, copy, box, from: state.getBoundingClientRect(), stateAbbr };
      mapFlight = flight;
      // If the home page never shows (an error, or the person goes elsewhere), drop the copy.
      setTimeout(() => { if (mapFlight === flight) { mapFlight = null; layer.remove(); } }, 5000);
    }
    function landMap() {
      const flight = mapFlight;
      mapFlight = null;
      if (!flight) return;
      const real = document.querySelector('.home-map');
      const realState = real && real.querySelector('.state');
      if (!realState) { flight.layer.remove(); return; }
      real.style.visibility = 'hidden';
      const timing = { duration: 1200, easing: 'cubic-bezier(0.65, 0, 0.35, 1)', fill: 'forwards' };
      const from = flight.from, to = realState.getBoundingClientRect(), o = flight.box;

      const move = `translate(${to.left - o.left - sx * (from.left - o.left)}px, ${to.top - o.top - sy * (from.top - o.top)}px) scale(${sx}, ${sy})`;
      const done = flight.copy.animate([{ transform: 'translate(0px, 0px) scale(1, 1)', opacity: 1 }, { transform: move, opacity: getComputedStyle(real).opacity }], timing);
      // Each line and fill eases from its setup style to the matching backdrop path's style.

      flight.copy.querySelectorAll('path').forEach((path) => {
        const match = path.dataset.district ? real.querySelector(`[data-district="${CSS.escape(path.dataset.district)}"]`)

        const start = look(path);
        if (start.opacity === '0') return;
        if (match) path.animate([{ ...start, strokeDashoffset: getComputedStyle(path).strokeDashoffset }, { ...look(match), opacity: 1, strokeDashoffset: '0px' }], timing);
        else path.animate([{ opacity: 1 }, { opacity: 0 }], { ...timing, duration: 700 }); // other states fade out
      });
      done.finished.then(() => { real.style.visibility = ''; flight.layer.remove(); });

    const boxAround = ([x0, y0, x1, y1]) => {

    // list can't be styled on a Mac). It follows the ARIA "select-only combobox" pattern: focus stays
    // on the button, arrow keys move through the list, Enter or Space chooses, Escape closes, and
    // typing letters jumps to a matching state. Choosing writes to the hidden select and fires its
    // change event, so the rest of the page reacts exactly as before.
    function wireStatePicker(select, perState) {
      const button = document.getElementById('state-button');
      const list = document.getElementById('state-list');

      let active = -1, typed = '', typedAt = 0;

      const close = () => { list.hidden = true; button.setAttribute('aria-expanded', 'false'); setActive(-1); };

        if (select.value !== o.dataset.value) { select.value = o.dataset.value; select.dispatchEvent(new Event('change')); }
      };
      button.addEventListener('click', () => (isOpen() ? close() : open()));
      button.addEventListener('keydown', (event) => {
        const last = options.length - 1;
        const move = { ArrowDown: Math.min(active + 1, last), ArrowUp: Math.max(active - 1, 0), Home: 0, End: last, PageDown: Math.min(active + 8, last), PageUp: Math.max(active - 8, 0) }[event.key];
        if (move !== undefined) { event.preventDefault(); if (!isOpen()) open(); else setActive(move); return; }
        if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); if (isOpen() && active >= 0) choose(active); else open(); return; }
        if (event.key === 'Escape' && isOpen()) { event.preventDefault(); close(); return; }
        if (event.key === 'Tab' && isOpen()) { close(); return; }
        if (event.key.length === 1 && /\S/.test(event.key) && !event.metaKey && !event.ctrlKey) {
          const now = Date.now();
          typed = (now - typedAt < 700 ? typed : '') + event.key.toLowerCase();
          typedAt = now;
          const match = options.findIndex((o) => o.querySelector('.state-name').textContent.toLowerCase().startsWith(typed));
          if (match >= 0) { if (!isOpen()) open(); setActive(match); }
        }
      });
      list.addEventListener('pointermove', (event) => { const o = event.target.closest('[role="option"]'); if (o) setActive(options.indexOf(o)); });
      list.addEventListener('click', (event) => { const o = event.target.closest('[role="option"]'); if (o) choose(options.indexOf(o)); });
      document.addEventListener('pointerdown', (event) => { if (isOpen() && !event.target.closest('.state-picker')) close(); });
    }

                  aria-label="${esc(s.name)}, ${plural(perState[s.abbr] || 0, 'member')}"><span class="state-name">${esc(s.name)}</span><span class="state-count">${perState[s.abbr] || 0}</span></li>`).join('')}
              </ul>
            </div>
          </div>
          <p id="member-status" class="meta" aria-live="polite"></p>
          <div id="member-grid" class="member-grid"></div>
          <p class="meta"><a href="#/login">Sign out</a></p>
        </div>
        ${usmap ? `<figure class="card us-map-card">
          <svg class="us-map" id="us-map" viewBox="${esc(usmap.viewBox)}" role="img" aria-label="Map of the United States">
            <g>${usmap.states.map((s) => `<path class="us-state" data-state="${esc(s.abbr)}" d="${esc(s.path)}" />`).join('')}</g>
            <g id="us-districts">${usmap.districts.map((d) => `<path class="us-district" data-state="${esc(d.state)}" data-district="${esc(d.id)}" d="${esc(d.path)}" />`).join('')}</g>
          </svg>
          <figcaption class="meta">Boundaries: ${link(usmap.source_url, 'U.S. Census Bureau')}, 2024 (119th Congress).</figcaption>
        </figure>` : ''}
      </div>`;
      const stateSelect = document.getElementById('state');
      wireStatePicker(stateSelect, perState);
      const grid = document.getElementById('member-grid');
      const status = document.getElementById('member-status');
      const svg = document.getElementById('us-map');
      const mark = (selector, cls, test) => svg && svg.querySelectorAll(selector).forEach((el) => el.classList.toggle(cls, test(el)));
      const PARTY = { D: ['dem', 'Democrat'], R: ['rep', 'Republican'] };
      // Outline one district on the map (drawn counterclockwise), or clear the outline with null.
      const outlineDistrict = (id) => {
        const current = svg && svg.querySelector('.us-district.selected');
        if (current && current.dataset.district === id) return;
        mark('.us-district', 'selected', (el) => el.dataset.district === id);
        const outline = svg && svg.querySelector('.us-district.selected');
        if (outline) { outline.parentNode.appendChild(outline); drawOutline(outline); } // drawn last, so its black line sits on top
      };

      // One square box per member, in district order: district, round official portrait, name, tinted
      // by party. In a covered state choosing a box opens that member's home page; elsewhere the boxes
      // only show who represents the state, for now.
      const seatOf = (m) => { const n = Number(m.district.split('-')[1]); return Number.isNaN(n) ? 0 : n; };
      const districtText = (d) => d.replace(/-AL$/, ' · At large').replace(/-Del$/, ' · Delegate');
      stateSelect.addEventListener('change', () => {
        const abbr = stateSelect.value;
        const linked = covered.has(abbr);
        const here = (linked ? members.filter((m) => stateOf(m) === abbr) : house.filter((m) => m.state === abbr)).sort((a, b) => seatOf(a) - seatOf(b));
        const parties = new Set(here.map((m) => m.party));
        grid.innerHTML = here.map((m) => {
          const [cls, word] = PARTY[m.party] || ['ind', 'Independent'];
          const label = `${districtText(m.district)}: ${m.title} ${m.name}, ${word}${m.note ? ', former member' : ''}`;
          const inner = `<span class="member-box-district">${esc(districtText(m.district))}${m.note ? ' <span class="member-box-note">· Former</span>' : ''}</span>
            ${m.bioguide_id ? `<img src="/photos/${encodeURIComponent(m.bioguide_id)}.jpg" alt="" width="60" height="60" loading="lazy">` : '<span class="member-box-photo" aria-hidden="true"></span>'}
            <span class="member-box-name${m.name.length > 19 ? ' long' : ''}">${esc(m.name)}</span>`;
          return linked
            ? `<a class="member-box ${cls}" href="#/bills/${encodeURIComponent(m.id)}/${encodeURIComponent(m.district)}" data-district="${esc(m.district)}" aria-label="${esc(label)}"${m.note ? ` title="${esc(m.note)}"` : ''}>${inner}</a>`
            : `<div class="member-box static ${cls}" role="group" aria-label="${esc(label)}">${inner}</div>`;
        }).join('') + (here.length ? `<p class="meta member-key">${[['D', 'Blue: Democrat'], ['R', 'Red: Republican'], ['I', 'Gray: Independent']].filter(([p]) => parties.has(p)).map(([, t]) => t).join(' · ')}</p>` : '');
        status.textContent = !abbr ? ''
          : !here.length ? 'No House members listed for this state.'
          : linked ? `${plural(here.length, 'member')}. Choose one to open their briefs; pointing at one outlines their district on the map.`
          : `${plural(here.length, 'member')} of the 119th Congress. Briefs cover New Jersey for now, so these boxes don't open yet.`;
        if (!svg) return;
        mark('.us-district', 'selected', () => false);
        mark('.us-state', 'selected', (el) => el.dataset.state === abbr);
        mark('.us-district', 'visible', (el) => el.dataset.state === abbr);
        const state = usmap.states.find((s) => s.abbr === abbr);
        zoomMap(svg, state ? boxAround(state.bbox) : usmap.viewBox);
      });
      // Pointing at or tabbing to a box outlines that district; leaving the boxes clears it.
      grid.addEventListener('pointerover', (event) => { const box = event.target.closest('a.member-box'); if (box) outlineDistrict(box.dataset.district); });
      grid.addEventListener('focusin', (event) => { const box = event.target.closest('a.member-box'); if (box) outlineDistrict(box.dataset.district); });
      grid.addEventListener('pointerleave', () => { if (!grid.contains(document.activeElement)) outlineDistrict(null); });
      grid.addEventListener('focusout', (event) => { if (!grid.contains(event.relatedTarget)) outlineDistrict(null); });
      grid.addEventListener('click', (event) => {
        const box = event.target.closest('a.member-box');
        if (!box || event.metaKey || event.ctrlKey || event.shiftKey) return; // let new-tab clicks work as links
        event.preventDefault();
        outlineDistrict(box.dataset.district);
        takeOffMap(svg, stateSelect.value);
        go(box.getAttribute('href'));
      });
    }
